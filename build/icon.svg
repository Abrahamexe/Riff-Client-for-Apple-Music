<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Riff Client uygulama ikonu (geliştirici seçimi 2026-10-15, "Pena r"): koyu karo, kırmızı gitar
       penası; penanın içindeki "r" negatif alandır. Kaynak bu dosya; icon.ico ve appIcon.ts
       `npm run icons` ile buradan üretilir. -->
  <defs>
    <linearGradient id="char" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2f"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a5c"/>
      <stop offset="1" stop-color="#fa2d48"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="58" fill="url(#char)"/>
  <path d="M128 216c-24 0-76-66-76-114 0-34 34-56 76-56s76 22 76 56c0 48-52 114-76 114z" fill="url(#hot)"/>
  <path d="M112 168v-48c0-18 12-28 32-28h10" fill="none" stroke="#17171a" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="16" y="16" width="224" height="224" rx="58" fill="url(#sheen)"/>
</svg>
